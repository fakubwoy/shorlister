<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CandidateDesk — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0f12;
  --surface: #13161b;
  --border: #1f2430;
  --border-light: #2a3040;
  --text: #e8eaf0;
  --muted: #6b7280;
  --accent: #4f8ef7;
  --accent-dim: rgba(79,142,247,0.15);
  --danger: #e24b4a;
  --serif: 'DM Serif Display', Georgia, serif;
  --mono: 'DM Mono', 'Courier New', monospace;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.grid-bg {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(79,142,247,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,142,247,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
.card {
  position: relative; z-index: 1;
  width: 380px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 40px 36px;
  box-shadow: 0 0 60px rgba(0,0,0,0.6);
}
.logo {
  font-family: var(--serif);
  font-size: 26px;
  color: var(--text);
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}
.logo span { color: var(--accent); font-style: italic; }
.subtitle {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 32px;
}
.field { margin-bottom: 16px; }
label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
input[type=text], input[type=password] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border-light);
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  padding: 10px 14px;
  border-radius: 6px;
  outline: none;
  transition: border-color 0.15s;
}
input:focus { border-color: var(--accent); }
.error-msg {
  background: rgba(226,75,74,0.12);
  border: 1px solid rgba(226,75,74,0.3);
  color: #f08080;
  font-size: 12px;
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 16px;
}
button[type=submit] {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  padding: 11px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 8px;
  letter-spacing: 0.05em;
  transition: opacity 0.15s;
}
button[type=submit]:hover { opacity: 0.88; }
.hint { font-size: 11px; color: var(--muted); margin-top: 20px; text-align: center; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="card">
  <div class="logo">Candidate<span>Desk</span></div>
  <div class="subtitle">Hiring Review Platform</div>
  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Sign in →</button>
  </form>
  <p class="hint">Session lasts 12 hours · Concurrent access supported</p>
</div>
</body>
</html>
